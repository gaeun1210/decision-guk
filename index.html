<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>결정국 — 고민은 접수하고, 결정은 즐겁게!</title>
  <meta name="description" content="고민을 접수하면 성향이 다른 장관 4명이 질문하고 투표해 판결을 내려 주는 픽셀 국무회의. 점심 메뉴부터 쇼핑까지, 결정은 즐겁게!" />
  <meta name="theme-color" content="#19274d" />
  <link rel="icon" type="image/png" href="assets/favicon.png" />
  <link rel="apple-touch-icon" href="assets/icon-192.png" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="결정국 — 고민은 접수하고, 결정은 즐겁게!" />
  <meta property="og:description" content="장관 4명이 질문하고 투표해 판결을 내려 주는 픽셀 국무회의" />
  <meta property="og:image" content="https://decision-guk.vercel.app/assets/og.jpg" />
  <meta property="og:url" content="https://decision-guk.vercel.app/" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/quiple/galmuri@latest/dist/galmuri.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
  <style>
    :root {
      --navy: #19274d;
      --navy-light: #304877;
      --ink: #17264b;
      --cream: #fff1df;
      --cream-deep: #f5d8b9;
      --gold: #ffc960;
      --orange: #f2a02a;
      --line: #d8b99a;
      --shadow: 0 5px 0 rgba(35, 47, 77, .18), 0 9px 20px rgba(34, 45, 73, .15);
    }

    * { box-sizing: border-box; }
    .brand, .hero h1, .hero-subtitle { font-family: "Galmuri11", "Pretendard", sans-serif; font-weight: 700; letter-spacing: 0; font-synthesis: none; -webkit-font-smoothing: none; text-rendering: optimizeSpeed; }
    body {
      margin: 0;
      color: var(--ink);
      font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      background: #a9c9ed;
    }
    button, input, textarea, select { font: inherit; }
    button { cursor: pointer; }

    .topbar {
      min-height: 88px;
      padding: 12px 24px;
      display: flex;
      align-items: center;
      gap: 22px;
      color: #fff;
      background: linear-gradient(100deg, #172344, #29385f);
      border-bottom: 4px solid #425b88;
      position: relative;
      z-index: 2;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      white-space: nowrap;
      font-size: 36px;
      text-shadow: 3px 3px 0 #0e1630;
    }
    .brand-icon { font-size: 47px; filter: drop-shadow(2px 3px 0 #101b36); }
    .tagline {
      padding-left: 20px;
      border-left: 2px solid #56698f;
      font-size: 17px;
      white-space: nowrap;
    }
    .sparkle { color: var(--gold); }
    nav {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      margin-left: auto;
    }
    nav button, .login-btn {
      color: #fff;
      border: 1px solid transparent;
      background: transparent;
      padding: 12px 15px;
      border-radius: 22px;
      font-weight: 800;
      white-space: nowrap;
    }
    nav button:hover, nav button.active, .login-btn:hover {
      color: var(--ink);
      background: #ffe4bf;
    }
    .login-btn { border-color: #617398; }

    .hero {
      min-height: 540px;
      padding: 28px 24px 36px;
      display: block;
      position: relative;
      overflow: hidden;
      background: #8fc2f4;
      border-bottom: 5px solid #465a7e;
    }
    .hero::after {
      content: "";
      position: absolute;
      inset: auto 0 0;
      height: 90px;
      background: linear-gradient(180deg, transparent, rgba(27, 39, 72, .5));
      pointer-events: none;
    }
    @media (min-width: 1001px) {
      .hero { background: linear-gradient(90deg, #17223f 0%, #22345c 45%, #2c4a6e 100%); }
      .hero-copy { width: min(700px, 40%); }
      .hero::after { display: none; }
    }
    .hero-copy { position: relative; z-index: 2; }
    .hero-copy { max-width: 640px; }
    .hero h1 {
      margin: 0 0 12px;
      color: #fff9f0;
      font-size: 48px;
      line-height: 1.25;
      text-shadow: 4px 4px 0 #0e1630;
    }
    .hero h1 em { color: #ffd36e; font-style: normal; }
    .hero-subtitle {
      margin: 0 0 22px;
      color: #fff;
      font-size: 24px;
      line-height: 1.3;
      text-shadow: 2px 2px 0 #0e1630;
    }
    .intake {
      padding: 16px;
      border: 3px solid #bd9b78;
      border-radius: 20px;
      background: rgba(255, 241, 223, .97);
      box-shadow: var(--shadow);
    }
    .intake-label {
      display: inline-block;
      margin: -34px 0 12px;
      padding: 7px 15px;
      color: white;
      background: var(--navy);
      border-radius: 16px;
      font-weight: 900;
      font-size: 19px;
    }
    .intake input {
      width: 100%;
      padding: 15px 17px;
      color: var(--ink);
      border: 2px solid #ddc7b2;
      border-radius: 16px;
      background: #fffaf5;
      outline: none;
      font-size: 18px;
    }
    .intake input:focus, textarea:focus, select:focus {
      border-color: #6989bd;
      box-shadow: 0 0 0 3px rgba(105, 137, 189, .18);
    }
    .categories {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 12px 0;
    }
    .category {
      padding: 8px 14px;
      color: var(--ink);
      border: 2px solid #efd0b0;
      border-radius: 24px;
      background: #ffe6ce;
      font-weight: 800;
    }
    .category.selected, .category:hover {
      background: #ffd278;
      border-color: #eab450;
    }
    .primary {
      width: min(100%, 400px);
      display: block;
      margin: 8px auto 0;
      padding: 12px 18px;
      color: white;
      border: 2px solid #657da9;
      border-radius: 26px;
      background: linear-gradient(#354e7e, #22365f);
      box-shadow: 0 4px 0 #182848;
      font-size: 18px;
      font-weight: 900;
    }
    .primary:hover { transform: translateY(-1px); filter: brightness(1.08); }

    .hero-art-box { position: absolute; inset: 0; overflow: hidden; z-index: 0; }
    .hero-art-box img.scene { position: absolute; left: 0; top: 0; max-width: none; user-select: none; -webkit-user-drag: none; }
    .sbubble {
      position: absolute;
      display: flex; flex-direction: column; justify-content: flex-start;
      pointer-events: none;
    }
    .sbubble .body {
      flex: 1;
      display: flex; align-items: center; justify-content: center;
      padding: 0 .4em;
      color: var(--ink);
      font-weight: 900; line-height: 1.25; text-align: center;
      background: #fff8ee;
      border: 2px solid var(--navy);
      border-radius: 9px;
      box-shadow: 2px 3px 0 rgba(24, 37, 68, .22);
    }
    .sbubble .tail { height: 0; position: relative; }
    .sbubble .tail::after {
      content: ""; position: absolute; left: 50%; top: -6px;
      width: 9px; height: 9px; background: #fff8ee;
      border: solid var(--navy); border-width: 0 2px 2px 0;
      transform: translateX(-50%) rotate(45deg);
    }
    .schip {
      position: absolute; transform: translate(-50%, -50%);
      padding: .15em .7em; color: #fff8eb; font-weight: 900; white-space: nowrap;
      background: #5b3b2a; border: 2px solid #3c2a20; border-radius: 6px;
      pointer-events: none;
    }

    .dashboard {
      display: grid;
      grid-template-columns: 1.08fr 1fr .72fr;
      gap: 14px;
      padding: 14px 22px 18px;
      background: #9ebbe1;
    }
    .panel {
      min-width: 0;
      padding: 14px;
      border: 3px solid #c09a75;
      border-radius: 17px;
      background: linear-gradient(145deg, #fff1df, #ffe5cb);
      box-shadow: var(--shadow);
    }
    .panel-heading {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0 0 10px;
      font-size: 19px;
      font-weight: 1000;
    }
    .panel-heading .more {
      margin-left: auto;
      padding: 4px;
      color: #795f4c;
      border: 0;
      background: transparent;
      font-weight: 800;
    }
    .records-list, .popular-list {
      overflow: hidden;
      border: 2px solid #ead2bc;
      border-radius: 15px;
      background: rgba(255,255,255,.48);
    }
    .record-row {
      display: grid;
      grid-template-columns: 38px minmax(0, 1fr) auto;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      border-bottom: 1px solid #ead7c6;
      font-size: 14px;
    }
    .record-row:last-child { border-bottom: 0; }
    .record-empty { grid-column: 1 / -1; white-space: normal; font-weight: 700; color: #6b5a4b; }
    .record-icon { font-size: 25px; }
    .record-title {
      overflow: hidden;
      color: var(--ink);
      text-overflow: ellipsis;
      white-space: nowrap;
      font-weight: 800;
    }
    .verdict-pill {
      padding: 5px 8px;
      border-radius: 20px;
      background: #ffe091;
      color: #614b23;
      font-size: 12px;
      font-weight: 900;
      white-space: nowrap;
    }
    .record-date { color: #776e6d; font-size: 12px; white-space: nowrap; }

    .popular-item {
      display: grid;
      grid-template-columns: 40px 48px minmax(0, 1fr) auto;
      align-items: center;
      gap: 8px;
      padding: 14px 10px;
      border-bottom: 1px solid #ead7c6;
    }
    .popular-item:last-child { border-bottom: 0; }
    .rank {
      width: 36px; height: 36px; display: grid; place-items: center;
      border-radius: 50%; background: #ffb92e; color: white;
      border: 2px solid #e59613; font-weight: 1000; font-size: 20px;
    }
    .popular-item:nth-child(2) .rank { background: #aeb5c8; border-color: #8c95ad; }
    .popular-item:nth-child(3) .rank { background: #ce8140; border-color: #ae622b; }
    .pop-icon { font-size: 30px; }
    .pop-title { font-weight: 900; font-size: 14px; }
    .pop-count { font-weight: 900; font-size: 12px; white-space: nowrap; }
    .bar {
      height: 7px; margin-top: 6px; background: #ead0b7;
      border-radius: 8px; overflow: hidden;
    }
    .bar i { display: block; height: 100%; background: #f4a51f; border-radius: inherit; }

    .special-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 9px;
    }
    .special {
      min-height: 105px;
      padding: 10px 5px;
      color: var(--ink);
      border: 2px solid #e5cdb8;
      border-radius: 15px;
      background: rgba(255,255,255,.38);
      font-weight: 900;
    }
    .special:hover { background: #fff6e9; transform: translateY(-2px); }
    .special b { display: block; margin-bottom: 4px; font-size: 31px; }
    .special span { display: block; font-size: 14px; }
    .special small { font-weight: 700; color: #5c5b66; }

    .avatar { width: 38px; height: 44px; object-fit: contain; image-rendering: pixelated; flex: none; }
    .avatar.emoji { font-size: 34px; line-height: 44px; text-align: center; }
    .opinion { display: flex; gap: 10px; align-items: flex-start; }
    .opinion.small { display: block; font-size: 14px; }
    .verdict-line { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .verdict-line b { font-size: 22px; }
    .stamp {
      padding: 2px 10px; color: #c23a2e; border: 3px solid #c23a2e; border-radius: 6px;
      font-weight: 900; transform: rotate(-8deg); animation: stampIn .5s .2s both cubic-bezier(.2, 1.6, .4, 1);
    }
    @keyframes stampIn { from { opacity: 0; transform: rotate(-8deg) scale(2.6); } to { opacity: 1; transform: rotate(-8deg) scale(1); } }
    .btn-row { display: flex; gap: 10px; flex-wrap: wrap; }
    .btn-row .primary { flex: 1 1 160px; margin-top: 8px; }
    .primary.secondary { background: linear-gradient(#f4d9b8, #e8c39b); color: var(--ink); border-color: #c9a27a; box-shadow: 0 4px 0 #b38a62; }
    .record-detail > summary { cursor: pointer; list-style: none; }
    .record-detail > summary::-webkit-details-marker { display: none; }
    .record-body { padding: 4px 6px 12px 34px; }
    .owl { height: 64px; width: auto; image-rendering: pixelated; }
    .empty .owl { height: 96px; margin-bottom: 6px; }
    .clerk { display: flex; align-items: center; gap: 10px; margin: 10px 0 4px; font-weight: 800; font-size: 14px; }
    .record-note { font-size: 13px; opacity: .75; }
    .footer-cat img { height: 52px; image-rendering: pixelated; vertical-align: middle; }
    footer {
      min-height: 72px;
      padding: 14px 26px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: white;
      background: #1e2d53;
      font-weight: 800;
    }
    .footer-brand { font-size: 17px; }
    .footer-cat { font-size: 45px; }


    .avatar-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin: 8px 0 14px; }
    .avatar-opt { display: grid; place-items: end center; height: 104px; padding: 6px 2px; border: 3px solid #d9bfa2; border-radius: 14px; background: #fff9f0; }
    .avatar-opt img { max-height: 84px; max-width: 100%; width: auto; image-rendering: pixelated; }
    .avatar-opt[aria-pressed="true"] { border-color: #2f4c85; background: #e4edff; box-shadow: 0 0 0 2px #2f4c85; }
    .avatar-opt span { font-size: 12px; font-weight: 700; color: #3b4a6b; }
    .login-btn img { height: 22px; width: auto; vertical-align: -5px; margin-right: 4px; image-rendering: pixelated; }
    @media (max-width: 650px) { .avatar-grid { grid-template-columns: repeat(4, 1fr); } }
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: grid;
      place-items: center;
      padding: 18px;
      background: rgba(15, 25, 48, .67);
    }
    .modal {
      width: min(680px, 100%);
      max-height: min(88vh, 850px);
      overflow: auto;
      padding: 22px;
      border: 3px solid #c49b75;
      border-radius: 20px;
      background: #fff1df;
      box-shadow: 0 16px 55px rgba(0,0,0,.3);
    }
    .modal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
    }
    .modal-head h2 { margin: 0; font-size: 24px; }
    .close {
      width: 38px; height: 38px; border: 0; border-radius: 50%;
      color: var(--ink); background: #f2d7bd; font-size: 22px;
    }
    .field { margin: 12px 0; }
    .field label { display: block; margin-bottom: 6px; font-weight: 900; }
    .field input, .field textarea, .field select {
      width: 100%; padding: 11px 12px;
      border: 2px solid #ddc7b2; border-radius: 11px;
      color: var(--ink); background: #fffaf5; outline: none;
    }
    .field textarea { min-height: 82px; resize: vertical; }
    .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .hint { color: #74685f; font-size: 13px; line-height: 1.6; }
    .result-summary {
      padding: 15px;
      margin-bottom: 14px;
      border-radius: 13px;
      background: #ffe0a6;
      font-weight: 900;
      line-height: 1.6;
    }
    .opinion {
      padding: 12px 14px;
      margin: 9px 0;
      border: 1px solid #e5ccb2;
      border-radius: 12px;
      background: rgba(255,255,255,.62);
      line-height: 1.6;
    }
    .opinion strong { display: block; margin-bottom: 3px; }
    .notice {
      padding: 12px;
      margin-top: 12px;
      border-left: 4px solid #e19b34;
      background: #fff7e9;
      color: #665642;
      font-size: 13px;
      line-height: 1.6;
    }
    .empty { padding: 20px; text-align: center; color: #766b62; }
    .list-action {
      display: flex; align-items: center; gap: 8px;
      padding: 10px 0; border-bottom: 1px solid #ead7c6;
    }
    .list-action:last-child { border-bottom: 0; }
    .list-action .record-title { flex: 1; }
    .delete-btn {
      padding: 6px 9px; border: 0; border-radius: 9px;
      background: #f4d0c2; color: #793a2a; font-weight: 800;
    }


    /* ===== 국무회의 단계 화면 ===== */
    .steps { display: flex; gap: 4px; margin: 0 0 14px; padding: 0; list-style: none; counter-reset: st; }
    .steps li { flex: 1; padding: 6px 4px; border-radius: 9px; background: #f1e2d2; color: #8a7a6c; font-size: 12px; font-weight: 800; text-align: center; counter-increment: st; }
    .steps li::before { content: counter(st) ". "; }
    .steps li.done { background: #d9e6cf; color: #44613a; }
    .steps li.now { background: var(--navy); color: #fff; }
    .label { display: block; margin-bottom: 6px; font-weight: 900; }
    .label small { font-weight: 600; color: #8a7a6c; }
    .chip-row { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip { padding: 7px 12px; border: 2px solid #ddc7b2; border-radius: 999px; background: #fffaf5; color: var(--ink); font-weight: 800; }
    .chip[aria-pressed="true"] { border-color: #2f4c85; background: #2f4c85; color: #fff; }
    .opt-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
    .opt-no { width: 24px; height: 24px; flex: none; border-radius: 50%; background: #f2d7bd; display: grid; place-items: center; font-size: 13px; font-weight: 900; }
    .opt-input { flex: 1; min-width: 0; padding: 10px 12px; border: 2px solid #ddc7b2; border-radius: 11px; background: #fffaf5; color: var(--ink); }
    .opt-del { flex: none; width: 34px; height: 34px; border: 0; border-radius: 9px; background: #f4d0c2; color: #793a2a; font-weight: 900; }
    .add-opt { margin: 2px 0 6px; padding: 7px 12px; border: 2px dashed #c9a27a; border-radius: 11px; background: transparent; color: #7a5636; font-weight: 800; }
    .more summary { cursor: pointer; font-weight: 800; color: #6b5a4b; margin-bottom: 8px; }
    .more textarea { width: 100%; min-height: 82px; padding: 11px 12px; border: 2px solid #ddc7b2; border-radius: 11px; background: #fffaf5; color: var(--ink); resize: vertical; }
    .info-box { margin: 12px 0; padding: 12px 14px; border-radius: 12px; background: #e4edff; line-height: 1.6; }
    .err { margin: 8px 0 0; padding: 9px 12px; border-radius: 10px; background: #fde3dc; color: #9a2f1c; font-weight: 800; font-size: 14px; }
    .ok { margin: 8px 0 0; padding: 9px 12px; border-radius: 10px; background: #dff1d8; color: #2f5a22; font-weight: 800; font-size: 14px; }
    .link-btn { padding: 0; border: 0; background: none; color: #2f4c85; font-weight: 900; text-decoration: underline; }
    .tabs { margin-bottom: 6px; }
    .err.small { padding: 4px 8px; font-size: 12.5px; }
    .field input[aria-invalid="true"] { border-color: #d0533c; background: #fff3f0; }
    .q-card { display: flex; align-items: flex-end; gap: 12px; margin: 4px 0 10px; }
    .q-sprite { width: 118px; height: auto; flex: none; image-rendering: pixelated; }
    .q-bubble { position: relative; flex: 1; padding: 12px 14px; border: 3px solid #2b3552; border-radius: 16px; background: #fff; box-shadow: 0 4px 0 rgba(43,53,82,.18); margin-bottom: 18px; }
    .q-bubble::before { content: ""; position: absolute; left: -12px; bottom: 16px; border: 9px solid transparent; border-right-color: #2b3552; border-left: 0; }
    .q-who { font-weight: 900; font-size: 14px; color: #44506e; display: flex; justify-content: space-between; gap: 8px; }
    .q-count { font-weight: 700; color: #8a7a6c; }
    .q-text { margin-top: 4px; font-size: 18px; font-weight: 900; line-height: 1.45; }
    .q-title { margin: 0 0 10px; font-weight: 900; color: #5d4e42; }
    .choice-list { display: grid; gap: 8px; margin-bottom: 6px; }
    .choice { padding: 13px 14px; border: 3px solid #ddc7b2; border-radius: 13px; background: #fffaf5; color: var(--ink); font-size: 17px; font-weight: 900; text-align: left; }
    .choice:hover, .choice:focus-visible { border-color: #2f4c85; }
    .choice[aria-pressed="true"] { border-color: #2f4c85; background: #e4edff; }
    .choice.abstain { font-size: 15px; color: #6b5a4b; border-style: dashed; }
    .prio-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 6px; }
    .prio { display: grid; justify-items: center; gap: 2px; padding: 8px 4px 10px; border: 3px solid #ddc7b2; border-radius: 14px; background: #fffaf5; color: var(--ink); }
    .prio img { height: 62px; width: auto; image-rendering: pixelated; }
    .prio b { font-size: 15px; }
    .prio small { color: #7b6d61; font-size: 12px; }
    .prio[aria-pressed="true"] { border-color: #2f4c85; background: #e4edff; box-shadow: 0 0 0 2px #2f4c85; }
    .tally { margin: 6px 0 12px; padding: 12px 14px; border-radius: 13px; background: rgba(255,255,255,.6); border: 1px solid #e5ccb2; }
    .tally-row { display: grid; grid-template-columns: minmax(80px, 30%) 1fr auto; align-items: center; gap: 10px; margin: 5px 0; font-weight: 800; }
    .tally-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    <nav aria-label="주 메뉴">
      <button class="active" data-action="home">🏠 홈</button>
      <button data-action="meeting">🏛️ 국무회의</button>
      <button data-action="polls">📮 국민 여론</button>
      <button data-action="records">📜 결정 기록실</button>
      <button data-action="stats">📊 내 통계</button>
      <button data-action="settings">⚙️ 설정</button>
      <button class="login-btn" data-action="login">👤 로그인</button>

  <main>
    <section class="hero">
      <div class="hero-copy">
        <h1><span class="spark s1" aria-hidden="true">✦</span><span class="spark s2" aria-hidden="true">✦</span>지금, 당신의 고민이<br><em>결정될</em> 차례입니다!</h1>
        <p class="hero-subtitle">장관들과 함께하는 고민 해결 국무회의!</p>
        <form class="intake" id="quick-form">
          <div class="intake-label">📣 오늘의 고민을 접수하세요!</div>
          <input id="quick-title" maxlength="100" placeholder="예) 오늘 저녁 뭐 먹지?, 이 옷 사도 될까?" aria-label="고민 제목" />
          <div class="categories" aria-label="고민 유형">
            <button class="category" type="button" data-category="나들이">✈️ 나들이</button>
            <button class="category" type="button" data-category="맛집">🍴 맛집</button>
            <button class="category" type="button" data-category="쇼핑">🛍️ 쇼핑</button>
            <button class="category" type="button" data-category="일상">📌 일상</button>
          </div>
          <button class="primary" type="submit">⚒️ 국무회의 시작하기 ▸</button>
        </form>
      </div>

      <div class="hero-art-box" id="hero-art" aria-hidden="true">
        <img class="scene" id="scene-img" src="assets/court-scene.png" alt="" />
      </div>
    </section>

    <section class="dashboard">
      <article class="panel">
        <h2 class="panel-heading">🕒 최근 결정 기록 <span id="recent-note" class="record-note"></span>
          <button class="more" data-action="records">더보기 ›</button>
        </h2>
        <div class="records-list" id="recent-list"></div>
      </article>

      <article class="panel" id="example-panel">
        <h2 class="panel-heading">💡 이런 고민도 접수해 보세요</h2>
        <div class="popular-list" id="example-list"></div>
      </article>

      <article class="panel poll-panel">
        <h2 class="panel-heading">📮 국민 여론 <span class="record-note">진행 중</span>
          <button class="more" data-action="polls">더보기 ›</button>
        </h2>
        <div class="popular-list" id="poll-home"></div>
        <button type="button" class="link-btn poll-home-new" id="poll-home-new">✍️ 내 고민도 여론에 올리기</button>
      </article>
    </section>
  </main>

  <footer>

  </footer>
